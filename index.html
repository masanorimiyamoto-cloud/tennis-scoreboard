<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Tennis Score (0-7)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #050810;
      --accent: #00f2ff; /* Cyber Cyan */
      --danger: #ff3355; /* Neon Red */
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    html, body {
      height: 100%;
      margin: 0;
      /* 背景を少し落ち着かせ、スコアを見やすく */
      background: radial-gradient(circle at 50% -30%, #112240 0%, #03050a 70%);
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    .wrap{
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: env(safe-area-inset-top) 16px 20px 16px;
      box-sizing: border-box;
      gap: 10px;
    }

    /* === HUD (Top Bar) === */
    .hud{
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
      z-index: 10;
    }

    .history{
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }
    .history .line{
      font-size: 16px; font-weight: 700; color: var(--accent);
      padding: 4px 10px; border-radius: 4px;
      background: rgba(0, 242, 255, 0.1);
      border: 1px solid rgba(0, 242, 255, 0.2);
    }

    .actions{
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }

    .btn-act{
      appearance: none; border: 1px solid var(--glass-border);
      background: var(--glass); color: rgba(255,255,255,0.8);
      font-family: inherit; font-size: 12px; font-weight: 700;
      padding: 8px 12px; border-radius: 6px; cursor: pointer;
      transition: all 0.1s;
    }
    .btn-act:active{ background: rgba(255,255,255,0.2); transform: scale(0.96); }
    .btn-act.next{ border-color: rgba(0,242,255,0.4); color: var(--accent); }
    .btn-act .hint{ font-size: 9px; opacity: 0.6; font-weight: 500; margin-left: 4px; }

    /* === Main Score Area === */
    .row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%; height: 100%;
    }

    /* スコアカード全体 */
    .score-card{
      position: relative;
      display: grid;
      grid-template-rows: 1fr auto; /* 上が巨大、下がボタン */
      border: 1px solid var(--glass-border);
      background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.2) 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
    }

    /* プラスボタン領域（数字部分） */
    .btn-plus{
      appearance: none; border: none; background: transparent;
      color: #fff; padding: 0; margin: 0; width: 100%; height: 100%;
      cursor: pointer; display: grid; place-items: center;
      /* タップ時のフィードバック */
      transition: background 0.1s, transform 0.1s;
    }
    .btn-plus:active{
      background: rgba(255,255,255,0.05);
      transform: scale(0.98);
    }

    .num{
      font-size: clamp(120px, 36vw, 450px);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 5px 20px rgba(0,0,0,0.5);
      font-variant-numeric: tabular-nums;
    }

    /* 明確なマイナスボタン */
    .btn-minus{
      appearance: none;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.2); /* 少し暗くして区別 */
      color: rgba(255,255,255,0.6);
      font-family: inherit;
      font-size: 32px; font-weight: 500;
      padding: 12px 0; /* タップしやすい高さ */
      width: 100%;
      cursor: pointer;
      transition: all 0.1s;
    }
    .btn-minus:active{
      background: rgba(255, 50, 50, 0.3); /* タップ時に赤く光る */
      color: #fff;
    }

    @media (max-width: 500px){ .row{ gap: 8px; } .score-card{ border-radius: 16px; } }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hud">
      <div class="history" id="history" aria-label="セット履歴"></div>
      <div class="actions">
        <button class="btn-act next" id="nextSetBtn">NEXT SET<span class="hint">長押し</span></button>
        <button class="btn-act" id="fullResetBtn">RESET<span class="hint">長押し</span></button>
      </div>
    </div>

    <div class="row">
      <div class="score-card" id="cardA">
        <button class="btn-plus" id="btnPlusA" aria-label="左を加算（長押しで0）">
          <span class="num">0</span>
        </button>
        <button class="btn-minus" id="btnMinusA" aria-label="左を減算">−</button>
      </div>

      <div class="score-card" id="cardB">
        <button class="btn-plus" id="btnPlusB" aria-label="右を加算（長押しで0）">
          <span class="num">0</span>
        </button>
        <button class="btn-minus" id="btnMinusB" aria-label="右を減算">−</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Config =====
    const MAX = 7; 
    const MS_SCORE_RESET = 800;  
    const MS_NEXT_SET   = 650;  
    const MS_FULL_RESET = 1200; 
    const HISTORY_MAX   = 6;

    // ===== DOM =====
    const $ = (id) => document.getElementById(id);
    const els = {
      cardA: $('cardA'), cardB: $('cardB'),
      btnPlusA: $('btnPlusA'), btnPlusB: $('btnPlusB'),
      btnMinusA: $('btnMinusA'), btnMinusB: $('btnMinusB'),
      history: $('history'),
      nextSetBtn: $('nextSetBtn'), fullResetBtn: $('fullResetBtn'),
    };
    const numA = els.btnPlusA.querySelector('.num');
    const numB = els.btnPlusB.querySelector('.num');

    // ===== Storage =====
    const KEYS = { A:'sA_v3', B:'sB_v3', H:'sH_v3' }; // Key updated
    const store = {
      getNum: (k) => Number(localStorage.getItem(k) ?? 0),
      set: (k, v) => localStorage.setItem(k, v),
      del: (k) => localStorage.removeItem(k),
      getJSON: (k) => { try{ return JSON.parse(localStorage.getItem(k))??[]; }catch{return[];} },
      setJSON: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
    };

    // ===== State =====
    let scoreA = store.getNum(KEYS.A);
    let scoreB = store.getNum(KEYS.B);
    let history = store.getJSON(KEYS.H);

    // ===== Utils =====
    const vib = (ms) => navigator.vibrate?.(ms);
    const inc = (v) => (v >= MAX) ? 0 : (v + 1);
    const dec = (v) => (v <= 0) ? 0 : (v - 1);

    function render(){
      numA.textContent = scoreA;
      numB.textContent = scoreB;
      els.history.innerHTML = history.slice(-HISTORY_MAX)
        .map(x => `<div class="line">${x.a}-${x.b}</div>`).join('');
    }

    function setScore(side, v){
      if(side === 'A'){ scoreA = v; store.set(KEYS.A, v); }
      else { scoreB = v; store.set(KEYS.B, v); }
      render();
    }

    // ===== Event Binding =====
    // Plus Button (Click to INC, Long-press to 0)
    function bindPlus(btn, side){
      let timer, longPressed = false;
      const clear = () => { if(timer){ clearTimeout(timer); timer=null;} };

      btn.onpointerdown = () => {
        longPressed = false; clear();
        timer = setTimeout(()=>{
          longPressed = true; setScore(side, 0); vib(60);
        }, MS_SCORE_RESET);
      }
      btn.onpointerup = () => {
        clear();
        if(!longPressed){
          setScore(side, inc(side==='A'?scoreA:scoreB)); vib(15);
        }
      }
      btn.onpointercancel = clear; btn.onpointerleave = clear;
    }

    // Minus Button (Simple Click)
    function bindMinus(btn, side){
      btn.onclick = () => {
        setScore(side, dec(side==='A'?scoreA:scoreB)); vib(30);
      }
    }

    // Action Buttons (Long-press only)
    function bindAction(btn, ms, action){
      let timer, fired = false;
      const clear = () => { if(timer) clearTimeout(timer); };
      btn.onpointerdown = () => {
        fired = false; clear();
        timer = setTimeout(()=>{ fired=true; action(); }, ms);
      }
      btn.onpointerup = () => { clear(); if(!fired) vib(10); } // hint vibration
      btn.onpointercancel = clear; btn.onpointerleave = clear;
    }

    // Setup Events
    bindPlus(els.btnPlusA, 'A'); bindPlus(els.btnPlusB, 'B');
    bindMinus(els.btnMinusA, 'A'); bindMinus(els.btnMinusB, 'B');

    bindAction(els.nextSetBtn, MS_NEXT_SET, () => {
      if(scoreA===0 && scoreB===0) return vib(10);
      history.push({a:scoreA, b:scoreB}); store.setJSON(KEYS.H, history);
      setScore('A',0); setScore('B',0); vib([50,30,50]);
    });
    bindAction(els.fullResetBtn, MS_FULL_RESET, () => {
      scoreA=0; scoreB=0; history=[];
      store.del(KEYS.A); store.del(KEYS.B); store.del(KEYS.H);
      render(); vib(200);
    });

    // Wake Lock
    (async()=>{ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch{} })();

    // Init
    render();
  </script>
</body>
</html>
