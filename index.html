<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tennis Score (0-6)</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0b1020;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      touch-action: manipulation; /* 余計なズーム等を抑制 */
      -webkit-user-select: none;
      user-select: none;
    }
    .wrap{
      height: 100%;
      display: grid;
      place-items: center;
    }
    .row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      width: min(900px, 100%);
      box-sizing: border-box;
    }
    button.score{
      height: min(70vh, 520px);
      border: 0;
      border-radius: 24px;
      background: #121a33;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      color: #fff;
      font-size: clamp(120px, 18vw, 260px);
      font-weight: 800;
      letter-spacing: .02em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button.score:active{
      transform: scale(0.99);
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <button class="score" id="a" aria-label="A score">0</button>
      <button class="score" id="b" aria-label="B score">0</button>
    </div>
  </div>

  <script>
    // ===== 基本設定 =====
    const MAX = 6;                // 0..6 ループ
    const LONG_PRESS_MS = 600;    // 長押し判定（ms）

    const els = {
      a: document.getElementById('a'),
      b: document.getElementById('b')
    };

    // スコア保持（任意：リロードしても保持）
    const load = (k) => Number(localStorage.getItem(k) ?? 0);
    const save = (k, v) => localStorage.setItem(k, String(v));

    let scoreA = load('scoreA');
    let scoreB = load('scoreB');

    function render(){
      els.a.textContent = scoreA;
      els.b.textContent = scoreB;
    }

    function inc(v){
      return (v >= MAX) ? 0 : (v + 1);
    }

    // ===== ① 長押しで 0 に戻す（短押しは +1） =====
    function bindScoreButton(btn, get, set, key){
      let timer = null;
      let longPressed = false;

      const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };

      btn.addEventListener('pointerdown', (e) => {
        // iOS等での余計な挙動を抑えたいので一応
        e.preventDefault?.();

        longPressed = false;
        clear();
        timer = setTimeout(() => {
          longPressed = true;
          set(0);
          save(key, 0);
          render();
          // 触感（対応端末のみ）
          navigator.vibrate?.(20);
        }, LONG_PRESS_MS);
      });

      btn.addEventListener('pointerup', () => {
        clear();
        if(!longPressed){
          const v = inc(get());
          set(v);
          save(key, v);
          render();
        }
      });

      btn.addEventListener('pointercancel', clear);
      btn.addEventListener('pointerleave', clear);
    }

    bindScoreButton(els.a, () => scoreA, (v)=>{ scoreA = v; }, 'scoreA');
    bindScoreButton(els.b, () => scoreB, (v)=>{ scoreB = v; }, 'scoreB');

    // ===== ④ スリープ防止（Wake Lock：対応ブラウザのみ） =====
    let wakeLock = null;

    async function requestWakeLock(){
      try{
        if(!('wakeLock' in navigator)) return; // 非対応なら何もしない
        wakeLock = await navigator.wakeLock.request('screen');
        // 解除された時（端末側の都合など）に備える
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }catch(e){
        // 失敗してもアプリは動かす（権限/対応状況など）
        wakeLock = null;
      }
    }

    // 画面が見えている間だけON（省電力）
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible'){
        requestWakeLock();
      }else{
        // 多くの場合、非表示になると自動解除されるので明示処理は不要
        wakeLock = null;
      }
    });

    // 初回
    render();
    requestWakeLock();

    // iOS Safari は wakeLock 非対応のことが多いです（その場合は通常通りスリープします）
  </script>
</body>
</html>
