<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tennis Score (0-6)</title>
  <style>
    :root{
      --bg1:#070b16;
      --bg2:#0b1020;
      --card1:#101933;
      --card2:#0f1730;
      --stroke: rgba(0,0,0,.55);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 800px at 50% 10%, rgba(90,120,255,.20), transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .wrap{
      height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      box-sizing: border-box;
      position: relative;
    }

    /* HUD */
    .hud{
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    /* セット履歴（横並び） */
    .history{
      pointer-events: none;
      max-width: 72%;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .history .line{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .01em;
      opacity: .62;
      line-height: 1.1;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(6px);
      width: fit-content;
      max-width: 100%;
      white-space: nowrap;
    }

    /* 右側ボタン群 */
    .actions{
      pointer-events: auto;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .btn{
      appearance: none;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.85);
      font-size: 13px;
      font-weight: 900;
      padding: 10px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      opacity: .75;
    }
    .btn:active{
      transform: scale(0.98);
      opacity: .95;
    }
    .btn .hint{
      font-size: 11px;
      font-weight: 800;

    }

      display: grid;
      grid-template-columns: 1fr 1fr;

</head>

<body>
  <div class="wrap">
    <div class="hud" aria-hidden="false">
      <div class="history" id="history" aria-label="セットスコア履歴"></div>

      <div class="actions">
        <button class="btn" id="nextSetBtn" aria-label="長押しで次セット（セットスコア保存して0-0）">
          次セット <span class="hint">長押し</span>
        </button>

        <button class="btn danger" id="fullResetBtn" aria-label="長押しで全消し（セット履歴も含めて全部リセット）">
          全消し <span class="hint">長押し</span>
        </button>
      </div>
    </div>

    <div class="row">
      <button class="score" id="a" aria-label="左">
        <span class="minus left" aria-label="左を1減らす" role="button">−</span>
        <span class="num">0</span>
      </button>

      <button class="score" id="b" aria-label="右">
        <span class="minus right" aria-label="右を1減らす" role="button">−</span>
        <span class="num">0</span>
      </button>
    </div>
  </div>

  <script>
    // ===== Config =====
    const MAX = 6;
    const MS_SCORE_RESET = 600;   // スコア長押し（片側）リセット
    const MS_NEXT_SET   = 650;   // 次セット
    const MS_FULL_RESET = 1200;  // 全消し（誤爆防止）
    const HISTORY_MAX   = 5;

    // ===== DOM =====
    const $ = (sel, root=document) => root.querySelector(sel);
    const els = {
      a: $('#a'),
      b: $('#b'),
      history: $('#history'),
      nextSetBtn: $('#nextSetBtn'),
      fullResetBtn: $('#fullResetBtn'),
    };
    const numA = $('.num', els.a);
    const numB = $('.num', els.b);

    // ===== Storage =====
    const KEYS = { A:'scoreA', B:'scoreB', H:'setHistory' };
    const store = {
      getNum: (k, def=0) => Number(localStorage.getItem(k) ?? def),
      set: (k, v) => localStorage.setItem(k, String(v)),
      del: (k) => localStorage.removeItem(k),
      getJSON: (k, def) => {
        try{
          const raw = localStorage.getItem(k);
          if(!raw) return def;
          const v = JSON.parse(raw);
          return v ?? def;
        }catch{
          return def;
        }
      },
      setJSON: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
    };

    // ===== State =====
    let scoreA = store.getNum(KEYS.A, 0);
    let scoreB = store.getNum(KEYS.B, 0);
    let history = store.getJSON(KEYS.H, []);
    if(!Array.isArray(history)) history = [];

    // ===== Utils =====
    const vib = (ms) => navigator.vibrate?.(ms);
    const inc = (v) => (v >= MAX) ? 0 : (v + 1);
    const dec = (v) => (v <= 0) ? 0 : (v - 1);
    const isMinus = (e) => e?.target?.classList?.contains('minus');

    function render(){
      numA.textContent = scoreA;
      numB.textContent = scoreB;

      const lines = history.slice(-HISTORY_MAX).map(x => `${x.a}-${x.b}`);
      els.history.innerHTML = lines.map(t => `<div class="line">${t}</div>`).join('');
    }

    function setScore(which, v){
      if(which === 'A'){ scoreA = v; store.set(KEYS.A, v); }
      else { scoreB = v; store.set(KEYS.B, v); }
      render();
    }

    // ===== Score buttons =====
    function bindScore(btn, which){
      let timer = null;
      let longPressed = false;

      const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };

      btn.addEventListener('pointerdown', (e) => {
        if(isMinus(e)) return;
        e.preventDefault?.();
        longPressed = false;
        clear();
        timer = setTimeout(() => {
          longPressed = true;
          setScore(which, 0);
          vib(20);
        }, MS_SCORE_RESET);
      });

      btn.addEventListener('pointerup', (e) => {
        clear();
        if(isMinus(e)) return;
        if(!longPressed){
          const cur = (which === 'A') ? scoreA : scoreB;
          setScore(which, inc(cur));
        }
      });

      btn.addEventListener('pointercancel', clear);
      btn.addEventListener('pointerleave', clear);
    }

    function bindMinus(minusEl, which){
      const onDown = (e) => {
        e.preventDefault?.();
        e.stopPropagation();
        const cur = (which === 'A') ? scoreA : scoreB;
        setScore(which, dec(cur));
        vib(10);
      };
      const stop = (e) => { e.preventDefault?.(); e.stopPropagation(); };

      minusEl.addEventListener('pointerdown', onDown);
      minusEl.addEventListener('pointerup', stop);
      minusEl.addEventListener('pointercancel', stop);
    }

    bindScore(els.a, 'A');
    bindScore(els.b, 'B');
    bindMinus($('.minus', els.a), 'A');
    bindMinus($('.minus', els.b), 'B');

    // ===== Set history + reset =====
    function pushCurrentSetAndReset(){
      if(scoreA === 0 && scoreB === 0){ vib(8); return; }

      history.push({ a: scoreA, b: scoreB });
      store.setJSON(KEYS.H, history);

      scoreA = 0; scoreB = 0;
      store.set(KEYS.A, 0);
      store.set(KEYS.B, 0);

      render();
      vib(25);
    }

    function fullResetAll(){
      scoreA = 0; scoreB = 0; history = [];
      store.del(KEYS.A); store.del(KEYS.B); store.del(KEYS.H);
      render();
      vib(35);
    }

    // ===== Long-press buttons =====
    function bindLongPress(btn, ms, onFire){
      let timer = null;
      let fired = false;

      const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };

      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault?.();
        fired = false;
        clear();
        timer = setTimeout(() => { fired = true; onFire(); }, ms);
      });

      btn.addEventListener('pointerup', (e) => {
        e.preventDefault?.();
        clear();
        if(!fired) vib(6);
      });

      btn.addEventListener('pointercancel', clear);
      btn.addEventListener('pointerleave', clear);
    }

    bindLongPress(els.nextSetBtn, MS_NEXT_SET, pushCurrentSetAndReset);
    bindLongPress(els.fullResetBtn, MS_FULL_RESET, fullResetAll);

    // ===== Wake Lock =====
    let wakeLock = null;
    async function requestWakeLock(){
      try{
        if(!('wakeLock' in navigator)) return;
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }catch{
        wakeLock = null;
      }
    }
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') requestWakeLock();
      else wakeLock = null;
    });

    render();
    requestWakeLock();
  </script>
</body>
</html>
