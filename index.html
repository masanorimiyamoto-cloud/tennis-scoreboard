<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Tennis Score Board Pro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #050810;
      --accent: #00f2ff;
      --danger: #ff3355;
      --warning: #ffcc00;
      --share: #4cd964;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    html, body {
      height: 100dvh; margin: 0;
      background: radial-gradient(circle at 50% 50%, #152036 0%, #03050a 90%);
      color: #fff; font-family: 'Chakra Petch', sans-serif;
      touch-action: manipulation; -webkit-user-select: none; user-select: none; overflow: hidden;
    }

    .wrap{
      height: 100%; width: 100%; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 8px; padding: 12px;
    }

    .hud{
      flex: 0 0 auto; display: flex; gap: 10px; align-items: center;
      z-index: 10; background: rgba(0,0,0,0.4); padding: 8px 12px;
      border-radius: 14px; border: 1px solid var(--glass-border);
      overflow-x: auto;
    }

    .history{
      flex: 1; display: flex; gap: 6px; overflow-x: auto;
      scrollbar-width: none; min-width: 0;
    }
    .history .line{
      font-size: 16px; font-weight: 700; color: var(--accent); padding: 4px 10px;
      border-radius: 6px; background: rgba(0, 242, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.2);
      white-space: nowrap;
    }

    .actions{ display: flex; gap: 6px; flex-shrink: 0; }
    
    .btn-act{
      border: 1px solid var(--glass-border); background: var(--glass);
      color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 700;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; text-transform: uppercase;
      white-space: nowrap;
    }
    .btn-act:active{ transform: scale(0.92); background: rgba(255,255,255,0.2); }
    .btn-act.next{ color: var(--accent); border-color: var(--accent); background: rgba(0, 242, 255, 0.05); }
    .btn-act.log{ color: var(--warning); border-color: var(--warning); background: rgba(255, 204, 0, 0.05); }

    .row{ flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .score-card{
      position: relative; display: flex; flex-direction: column;
      border: 1px solid var(--glass-border); background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.3) 100%);
      border-radius: 18px; overflow: hidden;
    }

    .player-label {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
      font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.4);
      padding: 2px 10px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1);
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis;
    }

    .btn-plus{ flex: 1; border: none; background: transparent; color: #fff; display: grid; place-items: center; width: 100%; cursor: pointer; }
    .num{ font-size: 35vmin; font-weight: 700; line-height: 1; text-shadow: 0 5px 20px rgba(0,0,0,0.6); font-variant-numeric: tabular-nums; }
    .btn-minus{ flex: 0 0 50px; border: none; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.4); font-size: 24px; font-weight: 700; cursor: pointer; display: grid; place-items: center; }

    /* === Log Modal === */
    #logOverlay {
      position: fixed; inset: 0; background: rgba(5, 8, 16, 0.95); backdrop-filter: blur(15px);
      z-index: 100; display: none; flex-direction: column; padding: 20px;
    }
    #logOverlay.active { display: flex; }
    .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
    .log-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    /* Log Item with Share */
    .log-item { 
      background: var(--glass); border: 1px solid var(--glass-border); 
      padding: 14px; border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .log-info { flex: 1; }
    .log-date { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
    .log-players { font-weight: 700; color: var(--accent); font-size: 14px; margin-bottom: 6px; }
    .log-sets { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    
    .btn-share {
      background: rgba(76, 217, 100, 0.1); border: 1px solid var(--share); color: var(--share);
      padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-share:active { background: var(--share); color: #000; }

    .btn-close { background: #333; border: none; color: white; padding: 10px 20px; border-radius: 8px; font-weight: 700; }
    .btn-clear-archive { background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 11px; padding: 8px 12px; border-radius: 6px; margin-top: 20px; align-self: center; }

    @media (orientation: landscape) and (max-height: 600px) {
      .wrap{ flex-direction: row; padding: 8px; gap: 8px; }
      .hud{ flex-direction: column; width: 80px; order: 2; padding: 8px 4px; overflow-y: auto; overflow-x: hidden; }
      .history{ flex-direction: column; max-height: 35%; width: 100%; }
      .actions{ flex-direction: column; width: 100%; }
      .btn-act{ font-size: 10px; padding: 10px 2px; width: 100%; }
      .row{ display: contents; }
      .score-card{ flex: 1; min-width: 0; }
      #cardA{ order: 1; }
      #cardB{ order: 3; }
      .num{ font-size: 55vh; } 
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hud">
      <div class="history" id="history"></div>
      <div class="actions">
        <button class="btn-act next" id="nextSetBtn">NEXT</button>
        <button class="btn-act log" id="openLogBtn">LOG</button>
        <button class="btn-act" id="fullResetBtn">RESET</button>
      </div>
    </div>

    <div class="row">
      <div class="score-card" id="cardA">
        <div class="player-label" id="labelA" onclick="editName('a')">Players1</div>
        <button class="btn-plus" id="btnPlusA"><span class="num">0</span></button>
        <button class="btn-minus" id="btnMinusA">−</button>
      </div>
      <div class="score-card" id="cardB">
        <div class="player-label" id="labelB" onclick="editName('b')">Players2</div>
        <button class="btn-plus" id="btnPlusB"><span class="num">0</span></button>
        <button class="btn-minus" id="btnMinusB">−</button>
      </div>
    </div>
  </div>

  <div id="logOverlay">
    <div class="log-header">
      <div style="font-size: 18px; font-weight: 700; color: var(--accent);">MATCH ARCHIVE</div>
      <button class="btn-close" id="closeLogBtn">CLOSE</button>
    </div>
    <div class="log-content" id="logContent"></div>
    <button class="btn-clear-archive" id="clearArchiveBtn">CLEAR ALL ARCHIVES</button>
  </div>

  <script>
    const MAX = 7, MS_RESET = 800, HISTORY_MAX = 8;
    const $ = (id) => document.getElementById(id);
    const store = {
      get: (k, def) => { const val = localStorage.getItem(k); return val ? JSON.parse(val) : def; },
      set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
    };

    let state = {
      a: store.get('scA_v9', 0),
      b: store.get('scB_v9', 0),
      nameA: store.get('nameA_v9', 'Players_1'),
      nameB: store.get('nameB_v9', 'Players_2'),
      hist: store.get('scHist_v9', []),
      archives: store.get('scArch_v9', [])
    };

    const render = () => {
      $('cardA').querySelector('.num').textContent = state.a;
      $('cardB').querySelector('.num').textContent = state.b;
      $('labelA').textContent = state.nameA;
      $('labelB').textContent = state.nameB;
      $('history').innerHTML = state.hist.slice(-HISTORY_MAX)
        .map(h => `<div class="line">${h.a}-${h.b}</div>`).join('');
      $('history').scrollLeft = $('history').scrollWidth;
    };

    // --- シェア機能の実装 ---
    const shareMatch = async (index) => {
      const m = state.archives[index];
      const setScores = m.sets.map(s => `${s.a}-${s.b}`).join(' / ');
      const text = `【Tennis Match Result】\n${m.date}\n${m.nameA} vs ${m.nameB}\nScore: ${setScores}\n#TennisScoreBoard`;

      if (navigator.share) {
        try {
          await navigator.share({ title: 'Match Result', text: text });
        } catch (err) { console.log("Share failed", err); }
      } else {
        // Share API非対応（PCブラウザ等）の場合はクリップボードへコピー
        navigator.clipboard.writeText(text);
        alert("Copied to clipboard!");
      }
    };

    const renderArchives = () => {
      const content = $('logContent');
      if (state.archives.length === 0) {
        content.innerHTML = '<div style="color:rgba(255,255,255,0.3); text-align:center; margin-top:40px;">No match records yet.</div>';
        return;
      }
      // 逆順で表示（最新が上）
      content.innerHTML = state.archives.map((m, idx) => `
        <div class="log-item">
          <div class="log-info">
            <div class="log-date">${m.date}</div>
            <div class="log-players">${m.nameA} vs ${m.nameB}</div>
            <div class="log-sets">${m.sets.map(s => `${s.a}-${s.b}`).join(' / ')}</div>
          </div>
          <button class="btn-share" onclick="shareMatch(${idx})">SHARE</button>
        </div>
      `).reverse().join('');
    };

    window.editName = (side) => {
      const current = side === 'a' ? state.nameA : state.nameB;
      const newName = prompt("名前を入力", current);
      if (newName) {
        state[side === 'a' ? 'nameA' : 'nameB'] = newName.toUpperCase();
        store.set(side === 'a' ? 'nameA_v9' : 'nameB_v9', state[side === 'a' ? 'nameA' : 'nameB']);
        render();
      }
    };

    const vib = (ptn) => navigator.vibrate?.(ptn);

    // --- Speech synthesis: Tennis-style score calls ---
    const speak = (text, lang = 'en-US', opts = {}) => {
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        u.rate = typeof opts.rate === 'number' ? opts.rate : 0.95;
        u.pitch = typeof opts.pitch === 'number' ? opts.pitch : 1;
        window.speechSynthesis.speak(u);
      } catch (e) { console.log('speak error', e); }
    };

    // Use raw numeric calls (e.g. "2 - 3") per user request
    const tennisCall = (a, b) => `${a} - ${b}`;

    // Debounced announcer: wait 2s after last score change, then speak slowly
    const ANNOUNCE_DELAY = 2000;
    let announceTimer = null;
    const scheduleAnnounce = () => {
      if (announceTimer) clearTimeout(announceTimer);
      announceTimer = setTimeout(() => {
        speak(tennisCall(state.a, state.b), 'en-US', { rate: 0.8, pitch: 0.95 });
        announceTimer = null;
      }, ANNOUNCE_DELAY);
    };

    // Immediate announce helper (no delay)
    const announceNow = () => { speak(tennisCall(state.a, state.b), 'en-US', { rate: 0.9, pitch: 0.98 }); };

    // update accepts optional announce flag to suppress speak during programmatic resets
    const update = (k, v, doAnnounce = true) => { state[k] = v; store.set(k==='a'?'scA_v9':'scB_v9', v); render(); if (doAnnounce) scheduleAnnounce(); };

    const bindCard = (card, key) => {
      const plus = card.querySelector('.btn-plus'), minus = card.querySelector('.btn-minus');
      let timer, holding = false;
      plus.onpointerdown = () => {
        holding = false; timer = setTimeout(() => { holding = true; update(key, 0); vib(60); }, MS_RESET);
      };
      plus.onpointerup = () => {
        clearTimeout(timer);
        if(!holding) { update(key, state[key] >= MAX ? 0 : state[key] + 1); vib(15); }
      };
      minus.onclick = () => { update(key, state[key] <= 0 ? 0 : state[key] - 1); vib(30); };
    };

    const bindAction = (btn, fn) => {
      let timer;
      btn.onpointerdown = () => { timer = setTimeout(fn, MS_RESET); };
      btn.onpointerup = () => { if(timer) { clearTimeout(timer); vib(5); } };
    };

    bindAction($('nextSetBtn'), () => {
      if(state.a===0 && state.b===0) return;
      const set = {a: state.a, b: state.b};
      state.hist.push(set);
      store.set('scHist_v9', state.hist);
      // Announce the archived set as raw numbers, then reset without additional announces
      speak(`Set recorded: ${set.a} - ${set.b}`);
      update('a', 0, false); update('b', 0, false); vib([40,40,40]);
    });

    bindAction($('fullResetBtn'), () => {
      if(state.hist.length > 0 || state.a > 0 || state.b > 0) {
        const currentSets = [...state.hist];
        if(state.a > 0 || state.b > 0) currentSets.push({a:state.a, b:state.b});
        state.archives.push({
          date: new Date().toLocaleString('ja-JP', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }),
          nameA: state.nameA, nameB: state.nameB, sets: currentSets
        });
        store.set('scArch_v9', state.archives);
      }
      state.a = 0; state.b = 0; state.hist = [];
      store.set('scA_v9', 0); store.set('scB_v9', 0); store.set('scHist_v9', []);
      render(); vib(200); announceNow();
      alert("Saved & Reset. Open LOG to share.");
    });

    $('openLogBtn').onclick = () => { renderArchives(); $('logOverlay').classList.add('active'); vib(10); };
    $('closeLogBtn').onclick = () => { $('logOverlay').classList.remove('active'); vib(5); };
    $('clearArchiveBtn').onclick = () => {
      if(confirm("Delete all archives?")) { state.archives = []; store.set('scArch_v9', []); renderArchives(); }
    };

    bindCard($('cardA'), 'a'); bindCard($('cardB'), 'b');
    (async()=>{try{if('wakeLock' in navigator) await navigator.wakeLock.request('screen');}catch{}})();
    render();
  </script>
</body>
</html>
