<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tennis Score (0-6)</title>
  <style>
    :root{
      --bg1:#070b16;
      --bg2:#0b1020;
      --card1:#101933;
      --card2:#0f1730;
      --stroke: rgba(0,0,0,.55);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 800px at 50% 10%, rgba(90,120,255,.20), transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .wrap{
      height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      box-sizing: border-box;
    }

    .row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: min(980px, 100%);
      height: min(86vh, 620px);
      box-sizing: border-box;
    }

    button.score{
      position: relative;
      display: grid;
      place-items: center;
      height: 100%;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
                  radial-gradient(900px 450px at 50% 0%, rgba(90,120,255,.15), transparent 60%),
                  linear-gradient(180deg, var(--card1), var(--card2));
      box-shadow: 0 18px 40px rgba(0,0,0,.40);
      color: #fff;
      font-size: clamp(216px, 31vw, 504px); /* ★20%大きく */
      font-weight: 900;
      letter-spacing: .01em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      overflow: hidden;
    }

    button.score:active{
      transform: scale(0.99);
      filter: brightness(1.10);
    }

    button.score .tag{
      position: absolute;
      top: 14px;
      font-size: 16px;
      font-weight: 900;
      opacity: .85;
      line-height: 1;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(6px);
    }
    button.score .tag.left{ left: 14px; }
    button.score .tag.right{ right: 14px; }

    button.score .num{
      font-size: inherit;
      line-height: 1;
      transform: translateY(2px);
      text-shadow:
        0 6px 18px rgba(0,0,0,.55),
        0 2px 0 rgba(0,0,0,.35);
      -webkit-text-stroke: 6px var(--stroke);
      paint-order: stroke fill;
    }

    /* マイナスボタン */
    button.score .minus{
      position: absolute;
      bottom: 16px;
      font-size: 28px;
      font-weight: 900;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.15);
      cursor: pointer;
      user-select: none;
    }
    button.score .minus.left{ left: 16px; }
    button.score .minus.right{ right: 16px; }
    button.score .minus:active{
      transform: scale(0.95);
      filter: brightness(1.2);
    }

    @media (max-width: 520px){
      .row{ height: 88vh; gap: 12px; }
      button.score{
        font-size: clamp(204px, 41vw, 456px); /* ★20%大きく */
        border-radius: 26px;
      }
      button.score .tag{ font-size: 15px; }
      button.score .num{ -webkit-text-stroke: 5px var(--stroke); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <button class="score" id="a" aria-label="先攻">
        <span class="tag left">先</span>
        <span class="minus left">−</span>
        <span class="num">0</span>
      </button>
      <button class="score" id="b" aria-label="後攻">
        <span class="tag right">後</span>
        <span class="minus right">−</span>
        <span class="num">0</span>
      </button>
    </div>
  </div>

  <script>
    const MAX = 6;
    const LONG_PRESS_MS = 600;

    const els = {
      a: document.getElementById('a'),
      b: document.getElementById('b')
    };
    const numA = els.a.querySelector('.num');
    const numB = els.b.querySelector('.num');

    const load = (k) => Number(localStorage.getItem(k) ?? 0);
    const save = (k, v) => localStorage.setItem(k, String(v));

    let scoreA = load('scoreA');
    let scoreB = load('scoreB');

    function render(){
      numA.textContent = scoreA;
      numB.textContent = scoreB;
    }
    function inc(v){ return (v >= MAX) ? 0 : (v + 1); }
    function dec(v){ return (v <= 0) ? 0 : (v - 1); }

    function bindScoreButton(btn, get, set, key){
      let timer = null;
      let longPressed = false;

      const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };

      btn.addEventListener('pointerdown', (e) => {
        if(e.target.classList.contains('minus')) return;
        e.preventDefault?.();
        longPressed = false;
        clear();
        timer = setTimeout(() => {
          longPressed = true;
          set(0);
          save(key, 0);
          render();
          navigator.vibrate?.(20);
        }, LONG_PRESS_MS);
      });

      btn.addEventListener('pointerup', () => {
        clear();
        if(!longPressed){
          const v = inc(get());
          set(v);
          save(key, v);
          render();
        }
      });

      btn.addEventListener('pointercancel', clear);
      btn.addEventListener('pointerleave', clear);
    }

    bindScoreButton(els.a, () => scoreA, (v)=>{ scoreA = v; }, 'scoreA');
    bindScoreButton(els.b, () => scoreB, (v)=>{ scoreB = v; }, 'scoreB');

    // マイナス処理
    els.a.querySelector('.minus').addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      scoreA = dec(scoreA);
      save('scoreA', scoreA);
      render();
    });
    els.b.querySelector('.minus').addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      scoreB = dec(scoreB);
      save('scoreB', scoreB);
      render();
    });

    // Wake Lock
    let wakeLock = null;
    async function requestWakeLock(){
      try{
        if(!('wakeLock' in navigator)) return;
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }catch(e){
        wakeLock = null;
      }
    }
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') requestWakeLock();
      else wakeLock = null;
    });

    render();
    requestWakeLock();
  </script>
</body>
</html>
