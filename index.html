<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tennis Score (0-6)</title>
  <style>
    :root{
      --bg1:#070b16;
      --bg2:#0b1020;
      --card1:#101933;
      --card2:#0f1730;
      --stroke: rgba(0,0,0,.55);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 800px at 50% 10%, rgba(90,120,255,.20), transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .wrap{
      height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      box-sizing: border-box;
      position: relative;
    }

    /* HUD */
    .hud{
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    /* セット履歴（横並び） */
    .history{
      pointer-events: none;
      max-width: 72%;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .history .line{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .01em;
      opacity: .62;
      line-height: 1.1;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(6px);
      width: fit-content;
      max-width: 100%;
      white-space: nowrap;
    }

    /* 右側ボタン群 */
    .actions{
      pointer-events: auto;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .btn{
      appearance: none;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.85);
      font-size: 13px;
      font-weight: 900;
      padding: 10px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      opacity: .75;
    }
    .btn:active{
      transform: scale(0.98);
      opacity: .95;
    }
    .btn .hint{
      font-size: 11px;
      font-weight: 800;
      opacity: .75;
    }

    /* 全消しボタンは少し目立たせすぎない */
    .btn.danger{
      opacity: .62;
    }

    .row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: min(980px, 100%);
      height: min(86vh, 620px);
      box-sizing: border-box;
    }

    button.score{
      position: relative;
      display: grid;
      place-items: center;
      height: 100%;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
                  radial-gradient(900px 450px at 50% 0%, rgba(90,120,255,.15), transparent 60%),
                  linear-gradient(180deg, var(--card1), var(--card2));
      box-shadow: 0 18px 40px rgba(0,0,0,.40);
      color: #fff;

      font-size: clamp(260px, 37vw, 605px);
      font-weight: 900;
      letter-spacing: .01em;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      overflow: hidden;
    }

    button.score:active{
      transform: scale(0.99);
      filter: brightness(1.10);
    }

    button.score .num{
      font-size: inherit;
      line-height: 1;
      transform: translateY(2px);
      text-shadow:
        0 6px 18px rgba(0,0,0,.55),
        0 2px 0 rgba(0,0,0,.35);
      -webkit-text-stroke: 6px var(--stroke);
      paint-order: stroke fill;
    }

    button.score .minus{
      position: absolute;
      bottom: 16px;
      font-size: 28px;
      font-weight: 900;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.15);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button.score .minus.left{ left: 16px; }
    button.score .minus.right{ right: 16px; }
    button.score .minus:active{
      transform: scale(0.95);
      filter: brightness(1.2);
    }

    @media (max-width: 520px){
      .row{ height: 88vh; gap: 12px; }
      button.score{
        font-size: clamp(245px, 49vw, 550px);
        border-radius: 26px;
      }
      button.score .num{ -webkit-text-stroke: 5px var(--stroke); }

      .history{ max-width: 66%; gap: 8px; }
      .history .line{ font-size: 22px; padding: 7px 10px; }
      .btn{ font-size: 12px; padding: 9px 11px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hud" aria-hidden="false">
      <div class="history" id="history" aria-label="セットスコア履歴"></div>

      <div class="actions">
        <button class="btn" id="nextSetBtn" aria-label="長押しで次セット（セットスコア保存して0-0）">
          次セット <span class="hint">長押し</span>
        </button>

        <button class="btn danger" id="fullResetBtn" aria-label="長押しで全消し（セット履歴も含めて全部リセット）">
          全消し <span class="hint">長押し</span>
        </button>
      </div>
    </div>

    <div class="row">
      <button class="score" id="a" aria-label="左">
        <span class="minus left" aria-label="左を1減らす" role="button">−</span>
        <span class="num">0</span>
      </button>

      <button class="score" id="b" aria-label="右">
        <span class="minus right" aria-label="右を1減らす" role="button">−</span>
        <span class="num">0</span>
      </button>
    </div>
  </div>

  <script>
    const MAX = 6;
    const LONG_PRESS_MS = 600;        // スコア長押しリセット（片側）
    const NEXT_SET_LONG_MS = 650;     // 次セット
    const FULL_RESET_LONG_MS = 1200;  // ★全消し（誤爆防止で長め）
    const HISTORY_MAX_LINES = 5;

    const els = {
      a: document.getElementById('a'),
      b: document.getElementById('b'),
      history: document.getElementById('history'),
      nextSetBtn: document.getElementById('nextSetBtn'),
      fullResetBtn: document.getElementById('fullResetBtn')
    };
    const numA = els.a.querySelector('.num');
    const numB = els.b.querySelector('.num');

    const load = (k) => localStorage.getItem(k);
    const save = (k, v) => localStorage.setItem(k, String(v));
    const del = (k) => localStorage.removeItem(k);
    const loadNum = (k) => Number(load(k) ?? 0);

    let scoreA = loadNum('scoreA');
    let scoreB = loadNum('scoreB');

    function loadHistory(){
      try{
        const raw = load('setHistory');
        if(!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      }catch{
        return [];
      }
    }
    function saveHistory(arr){
      save('setHistory', JSON.stringify(arr));
    }
    let setHistory = loadHistory();

    function inc(v){ return (v >= MAX) ? 0 : (v + 1); }
    function dec(v){ return (v <= 0) ? 0 : (v - 1); }

    function render(){
      numA.textContent = scoreA;
      numB.textContent = scoreB;
      renderHistory();
    }

    function renderHistory(){
      const lines = setHistory.slice(-HISTORY_MAX_LINES);
      els.history.innerHTML = lines.map((x) => {
        const label = `${x.n}set ${x.a}-${x.b}`;
        return `<div class="line">${label}</div>`;
      }).join('');
    }

    function isMinusTarget(e){
      return !!(e.target && e.target.classList && e.target.classList.contains('minus'));
    }

    function bindScoreButton(btn, get, set, key){
      let timer = null;
      let longPressed = false;

      const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };

      btn.addEventListener('pointerdown', (e) => {
        if(isMinusTarget(e)) return;
        e.preventDefault?.();
        longPressed = false;
        clear();
        timer = setTimeout(() => {
          longPressed = true;
          set(0);
          save(key, 0);
          render();
          navigator.vibrate?.(20);
        }, LONG_PRESS_MS);
      });

      btn.addEventListener('pointerup', (e) => {
        clear();
        if(isMinusTarget(e)) return;
        if(!longPressed){
          const v = inc(get());
          set(v);
          save(key, v);
          render();
        }
      });

      btn.addEventListener('pointercancel', clear);
      btn.addEventListener('pointerleave', clear);
    }

    bindScoreButton(els.a, () => scoreA, (v)=>{ scoreA = v; }, 'scoreA');
    bindScoreButton(els.b, () => scoreB, (v)=>{ scoreB = v; }, 'scoreB');

    function bindMinus(minusEl, get, set, key){
      minusEl.addEventListener('pointerdown', (e)=>{
        e.preventDefault?.();
        e.stopPropagation();
        const v = dec(get());
        set(v);
        save(key, v);
        render();
        navigator.vibrate?.(10);
      });
      minusEl.addEventListener('pointerup', (e)=>{
        e.preventDefault?.();
        e.stopPropagation();
      });
      minusEl.addEventListener('pointercancel', (e)=>{
        e.preventDefault?.();
        e.stopPropagation();
      });
    }

    bindMinus(els.a.querySelector('.minus'), ()=>scoreA, (v)=>{ scoreA = v; }, 'scoreA');
    bindMinus(els.b.querySelector('.minus'), ()=>scoreB, (v)=>{ scoreB = v; }, 'scoreB');

    function pushCurrentSetAndReset(){
      if(scoreA === 0 && scoreB === 0){
        navigator.vibrate?.(8);
        return;
      }
      const n = setHistory.length + 1;
      setHistory.push({ n, a: scoreA, b: scoreB });
      saveHistory(setHistory);

      scoreA = 0; scoreB = 0;
      save('scoreA', 0);
      save('scoreB', 0);

      render();
      navigator.vibrate?.(25);
    }

    function fullResetAll(){
      scoreA = 0; scoreB = 0;
      setHistory = [];

      // localStorageも全消し（このアプリが使うキーだけ）
      del('scoreA');
      del('scoreB');
      del('setHistory');

      render();
      navigator.vibrate?.(35);
    }

    function bindLongPressButton(btn, ms, onFire){
      let timer = null;
      let fired = false;

      const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };

      btn.addEventListener('pointerdown', (e)=>{
        e.preventDefault?.();
        fired = false;
        clear();
        timer = setTimeout(()=>{
          fired = true;
          onFire();
        }, ms);
      });

      btn.addEventListener('pointerup', (e)=>{
        e.preventDefault?.();
        clear();
        if(!fired) navigator.vibrate?.(6);
      });

      btn.addEventListener('pointercancel', clear);
      btn.addEventListener('pointerleave', clear);
    }

    bindLongPressButton(els.nextSetBtn, NEXT_SET_LONG_MS, pushCurrentSetAndReset);
    bindLongPressButton(els.fullResetBtn, FULL_RESET_LONG_MS, fullResetAll);

    // Wake Lock
    let wakeLock = null;
    async function requestWakeLock(){
      try{
        if(!('wakeLock' in navigator)) return;
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }catch(e){
        wakeLock = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') requestWakeLock();
      else wakeLock = null;
    });

    render();
    requestWakeLock();
  </script>
</body>
</html>
