<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Tennis Score Board</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #050810;
      --accent: #00f2ff;
      --danger: #ff3355;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    html, body {
      height: 100dvh;
      margin: 0;
      background: radial-gradient(circle at 50% 50%, #152036 0%, #03050a 90%);
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    .wrap{
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }

    /* === HUD (操作パネル) === */
    .hud{
      flex: 0 0 auto;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
    }

    .history{
      display: flex; gap: 8px; overflow-x: auto; max-width: 55%;
      scrollbar-width: none;
    }
    .history .line{
      font-size: 18px;
      font-weight: 700; color: var(--accent);
      padding: 4px 12px;
      border-radius: 6px;
      background: rgba(0, 242, 255, 0.12); border: 1px solid rgba(0, 242, 255, 0.3);
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .actions{ display: flex; gap: 10px; }
    
    .btn-act{
      border: 1px solid var(--glass-border); background: var(--glass);
      color: rgba(255,255,255,0.9); 
      font-size: 14px;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 8px; cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-act:active{ transform: scale(0.92); background: rgba(255,255,255,0.2); }
    .btn-act.next{ color: var(--accent); border-color: var(--accent); background: rgba(0, 242, 255, 0.05); }

    /* === Main Score Area === */
    .row{
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .score-card{
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--glass-border);
      background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.3) 100%);
      border-radius: 18px;
      overflow: hidden;
    }

    /* --- プレーヤー名ラベル --- */
    .player-label {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      white-space: nowrap;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-label:active {
      background: var(--accent);
      color: #000;
    }

    .btn-plus{
      flex: 1; border: none; background: transparent; color: #fff;
      display: grid; place-items: center; width: 100%; cursor: pointer;
    }
    .btn-plus:active{ background: rgba(255,255,255,0.05); }

    .num{
      font-size: 40vmin; 
      font-weight: 700; line-height: 1;
      text-shadow: 0 5px 20px rgba(0,0,0,0.6);
      font-variant-numeric: tabular-nums;
      transition: transform 0.1s;
    }

    .btn-minus{
      flex: 0 0 50px;
      border: none; border-top: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.4);
      font-size: 28px; font-weight: 700; cursor: pointer;
      display: grid; place-items: center;
    }
    .btn-minus:active{ background: rgba(255, 50, 50, 0.4); color: #fff; }

    /* ========== 横画面 (Landscape) モード最適化 ========== */
    @media (orientation: landscape) and (max-height: 600px) {
      .wrap{ flex-direction: row; padding: 8px; gap: 8px; }
      
      .hud{
        flex-direction: column;
        justify-content: space-between;
        width: 85px;
        order: 2;
        padding: 12px 6px;
      }
      .history{
        flex-direction: column; overflow-y: auto; overflow-x: hidden;
        max-height: 50%; max-width: 100%; gap: 6px;
      }
      .history .line { font-size: 16px; padding: 6px 4px; text-align: center; }
      
      .actions{ flex-direction: column; width: 100%; gap: 10px; }
      .btn-act{ font-size: 13px; padding: 12px 2px; width: 100%; }

      .row{ display: contents; }
      .score-card{ flex: 1; min-width: 0; }
      #cardA{ order: 1; }
      #cardB{ order: 3; }
      .num{ font-size: 55vh; } 
      .btn-minus { flex: 0 0 44px; }
      .player-label { top: 6px; font-size: 11px; padding: 1px 8px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hud">
      <div class="history" id="history"></div>
      <div class="actions">
        <button class="btn-act next" id="nextSetBtn">NEXT</button>
        <button class="btn-act" id="fullResetBtn">RESET</button>
      </div>
    </div>

    <div class="row">
      <div class="score-card" id="cardA">
        <div class="player-label" id="labelA" onclick="editName('a')">M & I</div>
        <button class="btn-plus" id="btnPlusA"><span class="num">0</span></button>
        <button class="btn-minus" id="btnMinusA">−</button>
      </div>
      <div class="score-card" id="cardB">
        <div class="player-label" id="labelB" onclick="editName('b')">OPPONENT</div>
        <button class="btn-plus" id="btnPlusB"><span class="num">0</span></button>
        <button class="btn-minus" id="btnMinusB">−</button>
      </div>
    </div>
  </div>

  <script>
    const MAX = 7; 
    const MS_RESET = 800;
    const HISTORY_MAX = 8;

    const $ = (id) => document.getElementById(id);
    const store = {
      get: (k, def) => {
        const val = localStorage.getItem(k);
        return val ? JSON.parse(val) : def;
      },
      set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
    };

    let state = {
      a: store.get('scA_v6', 0),
      b: store.get('scB_v6', 0),
      nameA: store.get('nameA_v6', 'M & I'),
      nameB: store.get('nameB_v6', 'OPPONENT'),
      hist: store.get('scHist_v6', [])
    };

    const render = () => {
      $('cardA').querySelector('.num').textContent = state.a;
      $('cardB').querySelector('.num').textContent = state.b;
      $('labelA').textContent = state.nameA;
      $('labelB').textContent = state.nameB;
      $('history').innerHTML = state.hist.slice(-HISTORY_MAX)
        .map(h => `<div class="line">${h.a}-${h.b}</div>`).join('');
      $('history').scrollTop = $('history').scrollHeight;
    };

    // --- 名前編集機能 ---
    window.editName = (side) => {
      const current = side === 'a' ? state.nameA : state.nameB;
      const newName = prompt("プレーヤー/ペア名を入力してください", current);
      if (newName !== null && newName.trim() !== "") {
        const key = side === 'a' ? 'nameA' : 'nameB';
        state[key] = newName.toUpperCase();
        store.set(key + '_v6', state[key]);
        render();
        vib(15);
      }
    };

    const vib = (ptn) => navigator.vibrate?.(ptn);
    const update = (k, v) => { 
      state[k] = v; 
      store.set(k==='a'?'scA_v6':'scB_v6', v); 
      render(); 
    };

    const bindCard = (card, key) => {
      const plus = card.querySelector('.btn-plus');
      const minus = card.querySelector('.btn-minus');
      let timer, holding = false;

      plus.onpointerdown = (e) => {
        holding = false; clearTimeout(timer);
        timer = setTimeout(() => {
          holding = true; update(key, 0); vib(60);
        }, MS_RESET);
      };
      plus.onpointerup = (e) => {
        clearTimeout(timer);
        if(!holding) {
          const n = state[key] >= MAX ? 0 : state[key] + 1;
          update(key, n); vib(15);
        }
      };
      minus.onclick = () => {
        const n = state[key] <= 0 ? 0 : state[key] - 1;
        update(key, n); vib(30);
      };
    };

    const bindAction = (btn, fn) => {
      let timer;
      btn.onpointerdown = () => {
        timer = setTimeout(() => { fn(); }, MS_RESET);
      };
      btn.onpointerup = () => { if(timer) { clearTimeout(timer); vib(5); } };
    };

    bindCard($('cardA'), 'a');
    bindCard($('cardB'), 'b');

    bindAction($('nextSetBtn'), () => {
      if(state.a===0 && state.b===0) return vib(10);
      state.hist.push({a:state.a, b:state.b});
      store.set('scHist_v6', state.hist);
      state.a=0; state.b=0; 
      store.set('scA_v6',0); store.set('scB_v6',0);
      render(); vib([40,40,40]);
    });

    bindAction($('fullResetBtn'), () => {
      localStorage.clear();
      state = {a:0, b:0, nameA:'M & I', nameB:'OPPONENT', hist:[]};
      render(); vib(200);
    });

    (async()=>{try{if('wakeLock' in navigator) await navigator.wakeLock.request('screen');}catch{}})();
    render();
  </script>
</body>
</html>
