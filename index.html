<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Tennis Score Board</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #050810;
      --accent: #00f2ff;
      --danger: #ff3355;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    html, body {
      height: 100dvh;
      margin: 0;
      background: radial-gradient(circle at 50% 50%, #152036 0%, #03050a 90%);
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    .wrap{
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }

    /* === HUD (操作パネル) === */
    .hud{
      flex: 0 0 auto;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      padding: 10px 16px; /* 余白を拡大 */
      border-radius: 14px;
      border: 1px solid var(--glass-border);
    }

    /* 履歴 (20%サイズアップ) */
    .history{
      display: flex; gap: 8px; overflow-x: auto; max-width: 55%;
      scrollbar-width: none;
    }
    .history .line{
      font-size: 18px; /* 14px -> 18px */
      font-weight: 700; color: var(--accent);
      padding: 4px 12px; /* 拡大 */
      border-radius: 6px;
      background: rgba(0, 242, 255, 0.12); border: 1px solid rgba(0, 242, 255, 0.3);
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .actions{ display: flex; gap: 10px; }
    
    /* NEXT/RESETボタン (20%サイズアップ) */
    .btn-act{
      border: 1px solid var(--glass-border); background: var(--glass);
      color: rgba(255,255,255,0.9); 
      font-size: 14px; /* 11px -> 14px */
      font-weight: 700;
      padding: 10px 16px; /* 6px -> 10px */
      border-radius: 8px; cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-act:active{ transform: scale(0.92); background: rgba(255,255,255,0.2); }
    .btn-act.next{ color: var(--accent); border-color: var(--accent); background: rgba(0, 242, 255, 0.05); }

    /* === Main Score Area === */
    .row{
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .score-card{
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--glass-border);
      background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.3) 100%);
      border-radius: 18px;
      overflow: hidden;
    }

    .btn-plus{
      flex: 1; border: none; background: transparent; color: #fff;
      display: grid; place-items: center; width: 100%; cursor: pointer;
    }
    .btn-plus:active{ background: rgba(255,255,255,0.05); }

    .num{
      font-size: 40vmin; 
      font-weight: 700; line-height: 1;
      text-shadow: 0 5px 20px rgba(0,0,0,0.6);
      font-variant-numeric: tabular-nums;
      transition: transform 0.1s;
    }

    .btn-minus{
      flex: 0 0 50px; /* 44px -> 50px */
      border: none; border-top: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.4);
      font-size: 28px; font-weight: 700; cursor: pointer;
      display: grid; place-items: center;
    }
    .btn-minus:active{ background: rgba(255, 50, 50, 0.4); color: #fff; }

    /* ========== 横画面 (Landscape) モード最適化 ========== */
    @media (orientation: landscape) and (max-height: 600px) {
      .wrap{ flex-direction: row; padding: 8px; gap: 8px; }
      
      .hud{
        flex-direction: column;
        justify-content: space-between;
        width: 85px; /* ボタンサイズアップに合わせて幅を拡大 */
        order: 2;
        padding: 12px 6px;
      }
      .history{
        flex-direction: column; overflow-y: auto; overflow-x: hidden;
        max-height: 50%; max-width: 100%; gap: 6px;
      }
      .history .line { font-size: 16px; padding: 6px 4px; text-align: center; }
      
      .actions{ flex-direction: column; width: 100%; gap: 10px; }
      .btn-act{ font-size: 13px; padding: 12px 2px; width: 100%; }
      .btn-act span { display: none; }

      .row{ display: contents; }
      .score-card{ flex: 1; min-width: 0; }
      #cardA{ order: 1; }
      #cardB{ order: 3; }
      .num{ font-size: 55vh; } 
      .btn-minus { flex: 0 0 44px; } /* 横画面では少し抑えて高さを確保 */
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hud">
      <div class="history" id="history"></div>
      <div class="actions">
        <button class="btn-act next" id="nextSetBtn">NEXT</button>
        <button class="btn-act" id="fullResetBtn">RESET</button>
      </div>
    </div>

    <div class="row">
      <div class="score-card" id="cardA">
        <button class="btn-plus" id="btnPlusA"><span class="num">0</span></button>
        <button class="btn-minus" id="btnMinusA">−</button>
      </div>
      <div class="score-card" id="cardB">
        <button class="btn-plus" id="btnPlusB"><span class="num">0</span></button>
        <button class="btn-minus" id="btnMinusB">−</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Config =====
    const MAX = 7; 
    const MS_RESET = 800;
    const HISTORY_MAX = 8; // 履歴を少し多めに表示可能に

    const $ = (id) => document.getElementById(id);
    const els = {
      cardA: $('cardA'), cardB: $('cardB'),
      history: $('history'),
      next: $('nextSetBtn'), reset: $('fullResetBtn'),
    };
    const ui = {
      numA: els.cardA.querySelector('.num'),
      numB: els.cardB.querySelector('.num'),
    };

    const store = {
      get: (k) => JSON.parse(localStorage.getItem(k)) || 0,
      set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
    };

    let state = {
      a: store.get('scA_v5'),
      b: store.get('scB_v5'),
      hist: store.get('scHist_v5') || []
    };

    const render = () => {
      ui.numA.textContent = state.a;
      ui.numB.textContent = state.b;
      els.history.innerHTML = state.hist.slice(-HISTORY_MAX)
        .map(h => `<div class="line">${h.a}-${h.b}</div>`).join('');
      // 自動スクロール（横画面用）
      els.history.scrollTop = els.history.scrollHeight;
    };
    const vib = (ptn) => navigator.vibrate?.(ptn);
    const update = (k, v) => { 
      state[k] = v; 
      store.set(k==='a'?'scA_v5':'scB_v5', v); 
      render(); 
    };

    const bindCard = (card, key) => {
      const plus = card.querySelector('.btn-plus');
      const minus = card.querySelector('.btn-minus');
      let timer, holding = false;

      plus.onpointerdown = (e) => {
        holding = false; clearTimeout(timer);
        timer = setTimeout(() => {
          holding = true; update(key, 0); vib(60);
        }, MS_RESET);
      };
      plus.onpointerup = (e) => {
        clearTimeout(timer);
        if(!holding) {
          const n = state[key] >= MAX ? 0 : state[key] + 1;
          update(key, n); vib(15);
        }
      };
      plus.onpointercancel = () => clearTimeout(timer);

      minus.onclick = () => {
        const n = state[key] <= 0 ? 0 : state[key] - 1;
        update(key, n); vib(30);
      };
    };

    const bindAction = (btn, fn) => {
      let timer;
      btn.onpointerdown = () => {
        timer = setTimeout(() => { fn(); }, MS_RESET);
      };
      btn.onpointerup = () => {
        if(timer) { clearTimeout(timer); vib(5); }
      };
      btn.onpointercancel = () => clearTimeout(timer);
    };

    bindCard(els.cardA, 'a');
    bindCard(els.cardB, 'b');

    bindAction(els.next, () => {
      if(state.a===0 && state.b===0) return vib(10);
      state.hist.push({a:state.a, b:state.b});
      store.set('scHist_v5', state.hist);
      state.a=0; state.b=0; 
      store.set('scA_v5',0); store.set('scB_v5',0);
      render(); vib([40,40,40]);
    });

    bindAction(els.reset, () => {
      localStorage.clear();
      state = {a:0, b:0, hist:[]};
      render(); vib(200);
    });

    (async()=>{try{if('wakeLock' in navigator) await navigator.wakeLock.request('screen');}catch{}})();
    
    render();
  </script>
</body>
</html>
