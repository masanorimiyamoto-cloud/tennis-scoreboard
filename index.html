<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tennis Score (0-6)</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0b1020;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .wrap{
      height: 100%;
      display: grid;
      place-items: center;
    }
    .row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      width: min(900px, 100%);
      box-sizing: border-box;
    }
    button.score{
      position: relative;
      display: grid;
      place-items: center;

      height: min(70vh, 520px);
      border: 0;
      border-radius: 24px;
      background: #121a33;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      color: #fff;
      font-size: clamp(120px, 18vw, 260px);
      font-weight: 800;
      letter-spacing: .02em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button.score:active{
      transform: scale(0.99);
      filter: brightness(1.08);
    }
    /* 左右識別（先/後） */
    button.score .tag{
      position: absolute;
      top: 14px;
      font-size: 18px;
      font-weight: 800;
      opacity: .8;
      line-height: 1;
    }
    button.score .tag.left{ left: 16px; }
    button.score .tag.right{ right: 16px; }
    button.score .num{ font-size: inherit; }
    #reloadBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      z-index: 9999;
      user-select: none;
    }
    #reloadBtn:active {
      transform: scale(0.92);
      background: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <button class="score" id="a" aria-label="先攻">
        <span class="tag left">先</span>
        <span class="num">0</span>
      </button>
      <button class="score" id="b" aria-label="後攻">
        <span class="tag right">後</span>
        <span class="num">0</span>
      </button>
    </div>
  </div>

  <script>
    // ===== 基本設定 =====
    const MAX = 6;                // 0..6 ループ
    const LONG_PRESS_MS = 600;    // 長押し判定（ms）

    const els = {
      a: document.getElementById('a'),
      b: document.getElementById('b')
    };

    const numA = els.a.querySelector('.num');
    const numB = els.b.querySelector('.num');

    // スコア保持（リロードしても保持）
    const load = (k) => Number(localStorage.getItem(k) ?? 0);
    const save = (k, v) => localStorage.setItem(k, String(v));

    let scoreA = load('scoreA');
    let scoreB = load('scoreB');

    function render(){
      numA.textContent = scoreA;
      numB.textContent = scoreB;
    }

    function inc(v){
      return (v >= MAX) ? 0 : (v + 1);
    }
    document.getElementById('reloadBtn').addEventListener('click', () => {
      location.reload();
    });
    // ===== ① 長押しで 0 に戻す（短押しは +1） =====
    function bindScoreButton(btn, get, set, key){
      let timer = null;
      let longPressed = false;

      const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };

      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault?.();

        longPressed = false;
        clear();
        timer = setTimeout(() => {
          longPressed = true;
          set(0);
          save(key, 0);
          render();
          navigator.vibrate?.(20);
        }, LONG_PRESS_MS);
      });

      btn.addEventListener('pointerup', () => {
        clear();
        if(!longPressed){
          const v = inc(get());
          set(v);
          save(key, v);
          render();
        }
      });

      btn.addEventListener('pointercancel', clear);
      btn.addEventListener('pointerleave', clear);
    }

    bindScoreButton(els.a, () => scoreA, (v)=>{ scoreA = v; }, 'scoreA');
    bindScoreButton(els.b, () => scoreB, (v)=>{ scoreB = v; }, 'scoreB');

    // ===== ④ スリープ防止（Wake Lock：対応ブラウザのみ） =====
    let wakeLock = null;

    async function requestWakeLock(){
      try{
        if(!('wakeLock' in navigator)) return; // 非対応なら何もしない
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }catch(e){
        wakeLock = null; // 失敗しても動作は継続
      }
    }

    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible'){
        requestWakeLock();
      }else{
        wakeLock = null;
      }
    });

    // 初回
    render();
    requestWakeLock();
  </script>
  <div id="reloadBtn">⟳</div>
</body>
</html>
